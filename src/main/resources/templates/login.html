<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Adega Caminho Novo</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">

<div th:replace="~{fragments/layout :: header('login', true)}"></div>

<main class="auth-main">
  <div class="auth-card">

    <a class="auth-brand" th:href="@{/}">
      <h2>ADEGA</h2>
      <h1>CAMINHO NOVO</h1>
      <small>VINHOS 100% NACIONAIS</small>
    </a>

    <div class="auth-divider">&#9670;</div>

    <h3 class="auth-title">ENTRAR</h3>
    <p class="auth-subtitle">Acesse sua conta para acompanhar pedidos e ofertas exclusivas.</p>

    <!-- mensagens de erro e de sucesso -->
    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>

    <!-- o POST e tratado pelo Spring Security -->
    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label for="email">E-MAIL</label>
        <input type="email" id="email" name="email"
               placeholder="seu@email.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="senha">SENHA</label>
        <input type="password" id="senha" name="senha"
               placeholder="Sua senha" required>
      </div>

      <button type="submit" class="btn-auth">ENTRAR</button>
    </form>

    <div class="auth-links">
      <a th:href="@{/recoverpassword}">Esqueci minha senha</a>
      <hr class="auth-links-separator">
      Ainda não tem conta?
      <a th:href="@{/register}">Cadastre-se</a>
    </div>

  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
