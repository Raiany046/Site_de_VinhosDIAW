<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta | Adega Caminho Novo</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header('conta', true)}"></div>

<section class="conta-section container">
  <div class="conta-card">

    <h2 th:text="'Olá, ' + ${usuario.nome} + '!'">Olá!</h2>
    <p class="auth-subtitle" style="text-align:left;margin-bottom:0;">
      Esta área só pode ser aberta por usuários autenticados.
    </p>

    <ul class="conta-dados">
      <li>
        <span>NOME</span>
        <span th:text="${usuario.nome}">Nome</span>
      </li>
      <li>
        <span>E-MAIL</span>
        <span th:text="${usuario.email}">email</span>
      </li>
      <li>
        <span>PERFIL</span>
        <span th:text="${usuario.role}">ROLE_USER</span>
      </li>
      <li>
        <span>CONTA CRIADA EM</span>
        <span th:text="${#temporals.format(usuario.criadoEm, 'dd/MM/yyyy HH:mm')}">data</span>
      </li>
    </ul>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn-auth">SAIR DA CONTA</button>
    </form>

  </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
