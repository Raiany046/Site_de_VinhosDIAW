<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha - Adega Caminho Novo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/recoverpassword.css}">
</head>

<body>

<div class="recover-container">

    <div class="recover-image-logo-container">
        <img th:src="@{/images/caminhonovologo.png}" alt="Logo Adega Caminho Novo">
        <div class="brand-text">
            <h2>ADEGA</h2>
            <h1>CAMINHO NOVO</h1>
            <small>VINHOS 100% NACIONAIS</small>
        </div>
    </div>

    <div class="recover-form">

        <h2 class="recover-title">RECUPERAR SENHA</h2>

        <p class="recover-description">
            Informe seu e-mail para receber as instruções de recuperação da senha.
        </p>

        <form th:action="@{/recoverpassword}" method="post">

            <div class="input-group">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required>
            </div>

            <div class="recover-button-container">
                <button type="submit">RECUPERAR SENHA</button>
            </div>

        </form>

        <div class="recover-redirect-options">
            Lembrou sua senha?
            <a th:href="@{/login}">Faça login</a>
        </div>

    </div>

</div>

</body>
</html>
