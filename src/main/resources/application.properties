spring.application.name=Adega Caminho Novo

# ---------------------------------------------------------------------------
# Banco de dados H2 em arquivo: os cadastros continuam valendo entre reinicios.
# O arquivo fica em ./data/adega.mv.db e esta no .gitignore.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/adega;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 (apenas para desenvolvimento): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Thymeleaf: cache desligado para que alteracoes no HTML aparecam sem rebuild.
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

server.port=8080
